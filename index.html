<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TUDOCRIA — Loja</title>

  <style>
    :root {
      --verde: #174d35;
      --verde-escuro: #0d3825;
      --creme: #f5f0df;
      --texto: #16231b;
      --cinza: #68736c;
      --linha: #dfe4dc;
      --branco: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--creme);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    /* CABEÇALHO */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--verde);
      padding: 12px 16px;
    }

    .topo {
      max-width: 1180px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .busca {
      flex: 1;
    }

    .busca input {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 999px;
      outline: none;
      font-size: 15px;
    }

    .botao-carrinho {
      border: none;
      border-radius: 10px;
      padding: 11px 14px;
      background: white;
      color: var(--verde);
      font-weight: 800;
      cursor: pointer;
    }

    /* CONTEÚDO */
    main {
      max-width: 1180px;
      margin: auto;
      padding: 18px 16px 70px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .contador {
      margin-top: 3px;
      color: var(--cinza);
      font-size: 13px;
    }

    /* PRODUTOS */
    .produtos {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 18px;
    }

    .produto {
      background: white;
      border: 1px solid var(--linha);
      border-radius: 16px;
      overflow: hidden;
    }

    .imagem-produto {
      aspect-ratio: 1 / 1;
      background: #eeeeee;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .imagem-produto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info-produto {
      padding: 12px;
    }

    .nome-produto {
      font-weight: 800;
      min-height: 38px;
    }

    .preco-produto {
      color: var(--verde);
      font-size: 20px;
      font-weight: 900;
      margin: 8px 0;
    }

    .botao-comprar {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--verde);
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .botao-comprar:hover {
      background: var(--verde-escuro);
    }

    .estado {
      grid-column: 1 / -1;
      background: white;
      border: 1px solid var(--linha);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
    }

    /* CARRINHO */
    .fundo-carrinho {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 50;
    }

    .fundo-carrinho.aberto {
      display: block;
    }

    .carrinho {
      position: absolute;
      right: 0;
      top: 0;
      width: min(430px, 94vw);
      height: 100%;
      background: white;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    .cabecalho-carrinho {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .fechar {
      border: none;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .itens-carrinho {
      flex: 1;
      overflow-y: auto;
      margin-top: 10px;
    }

    .item-carrinho {
      display: grid;
      grid-template-columns: 65px 1fr auto;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .item-carrinho img {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 8px;
    }

    .quantidade {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 7px;
    }

    .quantidade button {
      width: 25px;
      height: 25px;
      cursor: pointer;
    }

    .total {
      padding: 14px 0;
      font-size: 20px;
      font-weight: 900;
    }

    .whatsapp {
      display: block;
      padding: 14px;
      border-radius: 11px;
      background: #168c4b;
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: 900;
    }

    /* CELULAR */
    @media (max-width: 900px) {
      .produtos {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 650px) {

      .topo {
        flex-wrap: wrap;
      }

      .busca {
        order: 3;
        flex-basis: 100%;
      }

      .produtos {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      main {
        padding: 14px 10px 60px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="topo">

    <a class="logo" href="#">
      TUDOCRIA
    </a>

    <div class="busca">
      <input
        type="text"
        id="campoBusca"
        placeholder="Buscar produto..."
      >
    </div>

    <button
      class="botao-carrinho"
      id="botaoCarrinho"
    >
      🛒 Carrinho (<span id="quantidadeCarrinho">0</span>)
    </button>

  </div>
</header>


<main>

  <h1>Produtos</h1>

  <div
    class="contador"
    id="contador"
  >
    Carregando...
  </div>

  <section
    class="produtos"
    id="listaProdutos"
  >

    <div class="estado">
      Carregando produtos...
    </div>

  </section>

</main>


<!-- CARRINHO -->

<div
  class="fundo-carrinho"
  id="fundoCarrinho"
>

  <aside class="carrinho">

    <div class="cabecalho-carrinho">

      <h2>
        Seu carrinho
      </h2>

      <button
        class="fechar"
        id="fecharCarrinho"
      >
        Fechar
      </button>

    </div>


    <div
      class="itens-carrinho"
      id="itensCarrinho"
    >
    </div>


    <div class="total">
      Total: R$
      <span id="totalCarrinho">
        0,00
      </span>
    </div>


    <a
      class="whatsapp"
      id="botaoWhatsApp"
      target="_blank"
      rel="noopener"
    >
      Finalizar pelo WhatsApp
    </a>

  </aside>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

/*
   SEU WORKER
*/
const WORKER_URL =
  "https://tudocria.ricardorodrigues0671.workers.dev";


/*
   TABELA PRODUTOS
*/
const TABLE_ID = "1241177";


/*
   ENDPOINT FINAL
*/
const PRODUCT_ENDPOINT =
  WORKER_URL + "/produtos";


/*
   WHATSAPP DO CLIENTE
*/
const WHATSAPP_BASE =
  "https://wa.me/qr/CRLVURC2X5UTP1?s=p";


/* =====================================================
   VARIÁVEIS
===================================================== */

let produtos = [];

let carrinho = [];


/* =====================================================
   FORMATAÇÃO
===================================================== */

function formatarPreco(valor) {

  return Number(valor || 0)
    .toLocaleString(
      "pt-BR",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );

}


/* =====================================================
   SEGURANÇA HTML
===================================================== */

function escapar(texto) {

  return String(texto ?? "")
    .replace(/[&<>"']/g, function (caractere) {

      return {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[caractere];

    });

}


/* =====================================================
   NORMALIZAR PRODUTO DO BASEROW
===================================================== */

function normalizarProduto(produto) {

  return {

    id:
      produto.id ??
      produto.ID ??
      produto.pk,

    nome:
      produto.produto ??
      produto.nome ??
      produto.name ??
      produto["Nome"] ??
      "Produto",

    preco:
      Number(
        produto["preço de venda"] ??
        produto["preco de venda"] ??
        produto.preco ??
        produto.price ??
        produto["Preço"] ??
        0
      ),

    imagem:
      produto.imagem ??
      produto.image ??
      produto.foto ??
      produto["Imagem"] ??
      "",

    categoria:
      produto.categoria ??
      produto.category ??
      "",

    ativo:
      produto.ativo ??
      produto.active ??
      true

  };

}


/* =====================================================
   CARREGAR PRODUTOS
===================================================== */

async function carregarProdutos() {

  const lista =
    document.getElementById("listaProdutos");

  try {

    const resposta =
      await fetch(
        PRODUCT_ENDPOINT +
        "?table=" +
        encodeURIComponent(TABLE_ID),
        {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        }
      );


    if (!resposta.ok) {

      throw new Error(
        "Worker respondeu HTTP " +
        resposta.status
      );

    }


    const dados =
      await resposta.json();


    const registros =
      Array.isArray(dados)
        ? dados
        : (
            dados.results ||
            dados.products ||
            dados.produtos ||
            []
          );


    produtos =
      registros
        .map(normalizarProduto)
        .filter(
          produto =>
            produto.ativo !== false
        );


    renderizarProdutos();


  } catch (erro) {

    console.error(erro);

    lista.innerHTML = `
      <div class="estado">

        <b>
          Não foi possível carregar os produtos.
        </b>

        <br><br>

        <small>
          ${escapar(erro.message)}
        </small>

      </div>
    `;

  }

}


/* =====================================================
   MOSTRAR PRODUTOS
===================================================== */

function renderizarProdutos() {

  const busca =
    document
      .getElementById("campoBusca")
      .value
      .trim()
      .toLowerCase();


  const encontrados =
    produtos.filter(
      produto => {

        const texto =
          produto.nome +
          " " +
          produto.categoria;

        return texto
          .toLowerCase()
          .includes(busca);

      }
    );


  document
    .getElementById("contador")
    .textContent =
      encontrados.length +
      " produto(s)";


  if (!encontrados.length) {

    document
      .getElementById("listaProdutos")
      .innerHTML = `
        <div class="estado">
          Nenhum produto encontrado.
        </div>
      `;

    return;

  }


  document
    .getElementById("listaProdutos")
    .innerHTML =

    encontrados
      .map(produto => `

        <article class="produto">

          <div class="imagem-produto">

            ${
              produto.imagem

                ? `
                  <img
                    src="${escapar(produto.imagem)}"
                    alt="${escapar(produto.nome)}"
                    loading="lazy"
                  >
                `

                : `
                  <span>
                    Sem imagem
                  </span>
                `
            }

          </div>


          <div class="info-produto">

            <div class="nome-produto">
              ${escapar(produto.nome)}
            </div>


            <div class="preco-produto">
              R$ ${formatarPreco(produto.preco)}
            </div>


            <button
              class="botao-comprar"
              onclick='adicionarCarrinho(${JSON.stringify(produto.id)})'
            >
              Adicionar ao carrinho
            </button>

          </div>

        </article>

      `)
      .join("");

}


/* =====================================================
   ADICIONAR AO CARRINHO
===================================================== */

function adicionarCarrinho(id) {

  const produto =
    produtos.find(
      item =>
        String(item.id) === String(id)
    );


  if (!produto) {
    return;
  }


  const existente =
    carrinho.find(
      item =>
        String(item.id) === String(id)
    );


  if (existente) {

    existente.quantidade++;

  } else {

    carrinho.push({
      ...produto,
      quantidade: 1
    });

  }


  atualizarCarrinho();

  abrirCarrinho();

}


/* =====================================================
   ALTERAR QUANTIDADE
===================================================== */

function alterarQuantidade(id, valor) {

  const item =
    carrinho.find(
      produto =>
        String(produto.id) === String(id)
    );


  if (!item) {
    return;
  }


  item.quantidade += valor;


  if (item.quantidade <= 0) {

    carrinho =
      carrinho.filter(
        produto =>
          String(produto.id) !== String(id)
      );

  }


  atualizarCarrinho();

}


/* =====================================================
   ATUALIZAR CARRINHO
===================================================== */

function atualizarCarrinho() {

  const quantidadeTotal =
    carrinho.reduce(
      (total, produto) =>
        total + produto.quantidade,
      0
    );


  document
    .getElementById("quantidadeCarrinho")
    .textContent =
      quantidadeTotal;


  const container =
    document.getElementById("itensCarrinho");


  if (!carrinho.length) {

    container.innerHTML = `
      <div class="estado">
        Seu carrinho está vazio.
      </div>
    `;

  } else {

    container.innerHTML =

      carrinho
        .map(produto => `

          <div class="item-carrinho">

            ${
              produto.imagem

                ? `
                  <img
                    src="${escapar(produto.imagem)}"
                    alt=""
                  >
                `

                : `
                  <div
                    style="
                      background:#eee;
                      border-radius:8px;
                    "
                  ></div>
                `
            }


            <div>

              <b>
                ${escapar(produto.nome)}
              </b>

              <br>

              R$
              ${formatarPreco(produto.preco)}


              <div class="quantidade">

                <button
                  onclick='alterarQuantidade(${JSON.stringify(produto.id)}, -1)'
                >
                  −
                </button>


                <span>
                  ${produto.quantidade}
                </span>


                <button
                  onclick='alterarQuantidade(${JSON.stringify(produto.id)}, 1)'
                >
                  +
                </button>

              </div>

            </div>


            <strong>

              R$
              ${formatarPreco(
                produto.preco *
                produto.quantidade
              )}

            </strong>

          </div>

        `)
        .join("");

  }


  const total =
    carrinho.reduce(
      (soma, produto) =>
        soma +
        produto.preco *
        produto.quantidade,
      0
    );


  document
    .getElementById("totalCarrinho")
    .textContent =
      formatarPreco(total);


  /* =================================================
     MENSAGEM DO WHATSAPP
  ================================================= */

  let mensagem;


  if (carrinho.length) {

    const lista =
      carrinho
        .map(
          produto =>
            `• ${produto.nome} — ${produto.quantidade} unidade(s) — R$ ${formatarPreco(
              produto.preco *
              produto.quantidade
            )}`
        )
        .join("\n");


    mensagem =
      `Olá! Estou interessado nestes produtos:\n` +
      lista +
      `\n\n` +
      `Total: R$ ${formatarPreco(total)}` +
      `\nGostaria de finalizar a compra.`;

  } else {

    mensagem =
      "Olá! Estou interessado em um produto.";

  }


  document
    .getElementById("botaoWhatsApp")
    .href =
      WHATSAPP_BASE +
      "&text=" +
      encodeURIComponent(mensagem);

}


/* =====================================================
   ABRIR CARRINHO
===================================================== */

function abrirCarrinho() {

  document
    .getElementById("fundoCarrinho")
    .classList
    .add("aberto");

}


/* =====================================================
   FECHAR CARRINHO
===================================================== */

function fecharCarrinho() {

  document
    .getElementById("fundoCarrinho")
    .classList
    .remove("aberto");

}


/* =====================================================
   EVENTOS
===================================================== */

document
  .getElementById("botaoCarrinho")
  .addEventListener(
    "click",
    abrirCarrinho
  );


document
  .getElementById("fecharCarrinho")
  .addEventListener(
    "click",
    fecharCarrinho
  );


document
  .getElementById("fundoCarrinho")
  .addEventListener(
    "click",
    function(evento) {

      if (
        evento.target.id ===
        "fundoCarrinho"
      ) {

        fecharCarrinho();

      }

    }
  );


document
  .getElementById("campoBusca")
  .addEventListener(
    "input",
    renderizarProdutos
  );


/* =====================================================
   INICIAR
===================================================== */

carregarProdutos();

</script>

</body>
</html>

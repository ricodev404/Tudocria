<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TUDOCRIA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f0df;
      color: #173d2b;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;

      background: #0d5c3a;
      color: white;

      padding: 14px 20px;

      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      color: #fff;
    }

    .cart-button {
      border: none;
      background: #f5f0df;
      color: #0d5c3a;

      padding: 11px 16px;
      border-radius: 12px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
      transition: 0.2s;
    }

    .cart-button:hover {
      transform: scale(1.04);
    }

    #cartCount {
      background: #0d5c3a;
      color: white;

      padding: 2px 7px;
      border-radius: 20px;

      margin-left: 5px;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      max-width: 1200px;
      margin: 30px auto 20px;
      padding: 0 20px;
    }

    .hero h1 {
      font-size: 38px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .hero p {
      color: #5d6b63;
      font-size: 16px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
    }

    #search {
      width: 100%;

      padding: 15px 18px;

      border: 2px solid #d6d0bd;
      border-radius: 14px;

      background: white;

      font-size: 16px;
      outline: none;
    }

    #search:focus {
      border-color: #0d5c3a;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .products-container {
      max-width: 1200px;
      margin: 30px auto 80px;
      padding: 0 20px;
    }

    .products-grid {
      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 20px;
    }

    .product {
      background: white;

      border-radius: 18px;

      overflow: hidden;

      box-shadow: 0 5px 20px rgba(0,0,0,0.07);

      transition: 0.25s;
    }

    .product:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;

      background: #eee8d6;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    .no-image {
      color: #777;
      font-size: 14px;
    }

    .product-info {
      padding: 16px;
    }

    .product-name {
      font-size: 17px;
      font-weight: bold;

      min-height: 42px;

      margin-bottom: 8px;
    }

    .product-price {
      font-size: 22px;
      font-weight: 900;

      color: #0d5c3a;

      margin-bottom: 14px;
    }

    .add-button {
      width: 100%;

      border: none;

      background: #0d5c3a;
      color: white;

      padding: 12px;

      border-radius: 11px;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    .add-button:hover {
      background: #09472d;
    }

    /* =========================
       LOADING / EMPTY
    ========================= */

    .message {
      text-align: center;

      padding: 50px 20px;

      color: #657169;

      font-size: 17px;
    }

    .error {
      color: #a33;
    }

    /* =========================
       CART OVERLAY
    ========================= */

    .cart-overlay {
      position: fixed;

      inset: 0;

      background: rgba(0,0,0,0.45);

      z-index: 2000;

      display: none;
    }

    .cart-overlay.active {
      display: block;
    }

    /* =========================
       CART
    ========================= */

    .cart {
      position: fixed;

      top: 0;
      right: -450px;

      width: min(430px, 100%);

      height: 100vh;

      background: #f5f0df;

      z-index: 2100;

      transition: right 0.3s ease;

      display: flex;
      flex-direction: column;

      box-shadow: -5px 0 30px rgba(0,0,0,0.2);
    }

    .cart.open {
      right: 0;
    }

    .cart-header {
      background: #0d5c3a;
      color: white;

      padding: 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cart-header h2 {
      font-size: 21px;
    }

    .close-cart {
      background: none;
      border: none;

      color: white;

      font-size: 28px;

      cursor: pointer;
    }

    .cart-items {
      flex: 1;

      overflow-y: auto;

      padding: 15px;
    }

    .cart-empty {
      text-align: center;

      padding: 50px 20px;

      color: #6c756f;
    }

    .cart-item {
      background: white;

      border-radius: 14px;

      padding: 12px;

      margin-bottom: 12px;

      display: flex;

      gap: 12px;
    }

    .cart-item-image {
      width: 75px;
      height: 75px;

      border-radius: 10px;

      overflow: hidden;

      background: #eee8d6;

      flex-shrink: 0;
    }

    .cart-item-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-weight: bold;

      margin-bottom: 5px;
    }

    .cart-item-price {
      color: #0d5c3a;

      font-weight: bold;

      margin-bottom: 8px;
    }

    .quantity {
      display: flex;

      align-items: center;

      gap: 8px;
    }

    .quantity button {
      width: 27px;
      height: 27px;

      border: none;

      border-radius: 7px;

      background: #0d5c3a;
      color: white;

      font-size: 17px;

      cursor: pointer;
    }

    .quantity span {
      min-width: 20px;

      text-align: center;

      font-weight: bold;
    }

    .remove-item {
      border: none;

      background: none;

      color: #a33;

      cursor: pointer;

      font-size: 13px;

      margin-top: 7px;
    }

    /* =========================
       CART FOOTER
    ========================= */

    .cart-footer {
      padding: 18px;

      background: white;

      border-top: 1px solid #ddd6c2;
    }

    .cart-total {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 15px;
    }

    .cart-total span:first-child {
      font-size: 17px;
      font-weight: bold;
    }

    #cartTotal {
      font-size: 24px;

      font-weight: 900;

      color: #0d5c3a;
    }

    .checkout-button {
      width: 100%;

      border: none;

      background: #0d5c3a;
      color: white;

      padding: 15px;

      border-radius: 12px;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;
    }

    .checkout-button:hover {
      background: #09472d;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 900px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 650px) {
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .hero h1 {
        font-size: 30px;
      }

      .product-info {
        padding: 12px;
      }

      .product-name {
        font-size: 15px;
      }

      .product-price {
        font-size: 19px;
      }

      .add-button {
        padding: 10px;
      }
    }

    @media (max-width: 380px) {
      .products-grid {
        grid-template-columns: 1fr 1fr;
      }

      .logo {
        font-size: 23px;
      }

      .cart-button {
        padding: 9px 11px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>
    <div class="header-inner">

      <div class="logo">
        TUDOCRIA
      </div>

      <button class="cart-button" onclick="abrirCarrinho()">
        🛒 Carrinho
        <span id="cartCount">0</span>
      </button>

    </div>
  </header>


  <!-- HERO -->

  <section class="hero">

    <h1>Escolha o seu próximo par.</h1>

    <p>
      Encontre seu estilo e compre direto pelo WhatsApp.
    </p>

  </section>


  <!-- SEARCH -->

  <div class="search-container">

    <input
      type="text"
      id="search"
      placeholder="Buscar produto..."
      autocomplete="off"
    >

  </div>


  <!-- PRODUCTS -->

  <main class="products-container">

    <div id="products" class="products-grid">

      <div class="message">
        Carregando produtos...
      </div>

    </div>

  </main>


  <!-- CART OVERLAY -->

  <div
    id="cartOverlay"
    class="cart-overlay"
    onclick="fecharCarrinho()"
  ></div>


  <!-- CART -->

  <aside id="cart" class="cart">

    <div class="cart-header">

      <h2>Seu carrinho</h2>

      <button
        class="close-cart"
        onclick="fecharCarrinho()"
      >
        ×
      </button>

    </div>


    <div id="cartItems" class="cart-items">

      <div class="cart-empty">
        Seu carrinho está vazio.
      </div>

    </div>


    <div class="cart-footer">

      <div class="cart-total">

        <span>Total</span>

        <span id="cartTotal">
          R$ 0,00
        </span>

      </div>

      <button
        class="checkout-button"
        onclick="finalizarCompra()"
      >
        Finalizar compra pelo WhatsApp
      </button>

    </div>

  </aside>


  <script>

    /* =====================================
       CONFIGURAÇÕES
    ===================================== */

    const WORKER_URL =
      "https://tudocria.ricardorodrigues0671.workers.dev";

    const PRODUCT_ENDPOINT =
      WORKER_URL + "/produtos";

    const WHATSAPP_BASE =
      "https://wa.me/qr/CRLVURC2X5UTP1?s=p";


    /* =====================================
       VARIÁVEIS
    ===================================== */

    let produtos = [];

    let carrinho = [];


    /* =====================================
       FUNÇÕES DE CAMPO
    ===================================== */

    function obterCampo(obj, nomes) {

      for (const nome of nomes) {

        if (
          obj &&
          obj[nome] !== undefined &&
          obj[nome] !== null &&
          obj[nome] !== ""
        ) {
          return obj[nome];
        }

      }

      return "";

    }


    /* =====================================
       IMAGEM DO BASEROW - FILE
    ===================================== */

    function extrairImagem(campo) {

      if (!campo) {
        return "";
      }


      /* Baserow normalmente retorna File
         como um ARRAY de arquivos */

      if (Array.isArray(campo)) {

        if (campo.length === 0) {
          return "";
        }

        const arquivo = campo[0];

        if (!arquivo) {
          return "";
        }

        return (
          arquivo.url ||
          arquivo.signed_url ||
          arquivo.public_url ||
          ""
        );
      }


      /* Caso venha como objeto */

      if (typeof campo === "object") {

        return (
          campo.url ||
          campo.signed_url ||
          campo.public_url ||
          ""
        );
      }


      /* Caso venha como texto */

      if (typeof campo === "string") {
        return campo;
      }


      return "";
    }


    /* =====================================
       PREÇO
    ===================================== */

    function converterPreco(valor) {

      if (
        valor === null ||
        valor === undefined ||
        valor === ""
      ) {
        return 0;
      }


      /* Se já for número */

      if (typeof valor === "number") {

        return isFinite(valor)
          ? valor
          : 0;
      }


      /* Se vier como texto */

      let texto = String(valor).trim();

      texto = texto
        .replace("R$", "")
        .replace(/\s/g, "");


      /*
        Aceita:

        99.90
        99,90
        1.00
        1,00
      */

      if (
        texto.includes(",") &&
        texto.includes(".")
      ) {

        texto = texto
          .replace(/\./g, "")
          .replace(",", ".");

      } else {

        texto = texto.replace(",", ".");

      }


      const numero = parseFloat(texto);


      return isFinite(numero)
        ? numero
        : 0;
    }


    /* =====================================
       NORMALIZAR PRODUTO
    ===================================== */

    function normalizarProduto(p) {

      /*
        IMPORTANTE:

        O preço utilizado é somente:

        Preço venda

        O Preço custo NÃO é utilizado.
      */

      const nome = obterCampo(
        p,
        [
          "Nome",
          "nome",
          "Produto",
          "produto",
          "Nome do produto",
          "nome do produto"
        ]
      );


      const precoVenda = obterCampo(
        p,
        [
          "Preço venda",
          "preço venda",
          "Preco venda",
          "preco venda",

          "Preço de venda",
          "preço de venda",
          "Preco de venda",
          "preco de venda",

          "Preço Venda",
          "PREÇO VENDA"
        ]
      );


      const campoImagem = obterCampo(
        p,
        [
          "Imagem",
          "imagem",
          "Foto",
          "foto",
          "Fotos",
          "fotos",
          "Imagem do produto",
          "imagem do produto"
        ]
      );


      const imagem = extrairImagem(campoImagem);


      return {

        id:
          p.id ||
          Math.random().toString(36).slice(2),

        nome:
          nome ||
          "Produto",

        preco:
          converterPreco(precoVenda),

        imagem:
          imagem

      };

    }


    /* =====================================
       FORMATAR PREÇO
    ===================================== */

    function formatarPreco(valor) {

      return Number(valor || 0).toLocaleString(
        "pt-BR",
        {
          style: "currency",
          currency: "BRL"
        }
      );

    }


    /* =====================================
       CARREGAR PRODUTOS
    ===================================== */

    async function carregarProdutos() {

      const container =
        document.getElementById("products");


      try {

        container.innerHTML = `
          <div class="message">
            Carregando produtos...
          </div>
        `;


        const resposta =
          await fetch(PRODUCT_ENDPOINT);


        if (!resposta.ok) {

          throw new Error(
            "Erro HTTP " + resposta.status
          );

        }


        const dados =
          await resposta.json();


        /*
          O Worker normalmente retorna:

          {
            count: ...,
            next: ...,
            previous: ...,
            results: [...]
          }

          Mas também aceitamos diretamente
          um array.
        */

        let registros = [];


        if (Array.isArray(dados)) {

          registros = dados;

        } else if (
          dados &&
          Array.isArray(dados.results)
        ) {

          registros = dados.results;

        } else {

          registros = [];

        }


        produtos =
          registros.map(normalizarProduto);


        console.log(
          "Produtos recebidos do Baserow:",
          registros
        );

        console.log(
          "Produtos normalizados:",
          produtos
        );


        renderizarProdutos(produtos);


      } catch (erro) {

        console.error(
          "Erro ao carregar produtos:",
          erro
        );


        container.innerHTML = `
          <div class="message error">
            Não foi possível carregar os produtos.
            <br><br>
            Tente atualizar a página.
          </div>
        `;

      }

    }


    /* =====================================
       RENDERIZAR PRODUTOS
    ===================================== */

    function renderizarProdutos(lista) {

      const container =
        document.getElementById("products");


      if (!lista.length) {

        container.innerHTML = `
          <div class="message">
            Nenhum produto encontrado.
          </div>
        `;

        return;
      }


      container.innerHTML =
        lista.map(produto => {

          const imagemHTML =
            produto.imagem
              ? `
                <img
                  src="${escapeHTML(produto.imagem)}"
                  alt="${escapeHTML(produto.nome)}"
                  loading="lazy"
                  onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=&quot;no-image&quot;>Imagem indisponível</span>';"
                >
              `
              : `
                <span class="no-image">
                  Sem imagem
                </span>
              `;


          return `

            <article class="product">

              <div class="product-image">
                ${imagemHTML}
              </div>


              <div class="product-info">

                <div class="product-name">
                  ${escapeHTML(produto.nome)}
                </div>


                <div class="product-price">
                  ${formatarPreco(produto.preco)}
                </div>


                <button
                  class="add-button"
                  onclick="adicionarAoCarrinho('${String(produto.id).replace(/'/g, "\\'")}')"
                >
                  Adicionar ao carrinho
                </button>

              </div>

            </article>

          `;

        }).join("");

    }


    /* =====================================
       ESCAPAR HTML
    ===================================== */

    function escapeHTML(valor) {

      return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =====================================
       ADICIONAR AO CARRINHO
    ===================================== */

    function adicionarAoCarrinho(id) {

      const produto =
        produtos.find(
          p => String(p.id) === String(id)
        );


      if (!produto) {
        return;
      }


      const existente =
        carrinho.find(
          item =>
            String(item.id) === String(id)
        );


      if (existente) {

        existente.quantidade++;

      } else {

        carrinho.push({

          ...produto,

          quantidade: 1

        });

      }


      atualizarCarrinho();

      abrirCarrinho();

    }


    /* =====================================
       ALTERAR QUANTIDADE
    ===================================== */

    function alterarQuantidade(id, quantidade) {

      const item =
        carrinho.find(
          p =>
            String(p.id) === String(id)
        );


      if (!item) {
        return;
      }


      item.quantidade = quantidade;


      if (item.quantidade <= 0) {

        carrinho =
          carrinho.filter(
            p =>
              String(p.id) !== String(id)
          );

      }


      atualizarCarrinho();

    }


    /* =====================================
       REMOVER ITEM
    ===================================== */

    function removerItem(id) {

      carrinho =
        carrinho.filter(
          item =>
            String(item.id) !== String(id)
        );


      atualizarCarrinho();

    }


    /* =====================================
       ATUALIZAR CARRINHO
    ===================================== */

    function atualizarCarrinho() {

      const container =
        document.getElementById("cartItems");


      const count =
        carrinho.reduce(
          (total, item) =>
            total + item.quantidade,
          0
        );


      document.getElementById(
        "cartCount"
      ).textContent = count;


      if (!carrinho.length) {

        container.innerHTML = `
          <div class="cart-empty">
            Seu carrinho está vazio.
          </div>
        `;


        document.getElementById(
          "cartTotal"
        ).textContent =
          formatarPreco(0);


        return;

      }


      container.innerHTML =
        carrinho.map(item => {

          const imagem =
            item.imagem
              ? `
                <img
                  src="${escapeHTML(item.imagem)}"
                  alt="${escapeHTML(item.nome)}"
                >
              `
              : "";


          return `

            <div class="cart-item">

              <div class="cart-item-image">
                ${imagem}
              </div>


              <div class="cart-item-info">

                <div class="cart-item-name">
                  ${escapeHTML(item.nome)}
                </div>


                <div class="cart-item-price">
                  ${formatarPreco(item.preco)}
                </div>


                <div class="quantity">

                  <button
                    onclick="alterarQuantidade(
                      '${String(item.id).replace(/'/g, "\\'")}',
                      ${item.quantidade - 1}
                    )"
                  >
                    −
                  </button>


                  <span>
                    ${item.quantidade}
                  </span>


                  <button
                    onclick="alterarQuantidade(
                      '${String(item.id).replace(/'/g, "\\'")}',
                      ${item.quantidade + 1}
                    )"
                  >
                    +
                  </button>

                </div>


                <button
                  class="remove-item"
                  onclick="removerItem('${String(item.id).replace(/'/g, "\\'")}')"
                >
                  Remover
                </button>

              </div>

            </div>

          `;

        }).join("");


      const total =
        carrinho.reduce(
          (soma, item) =>
            soma +
            (item.preco * item.quantidade),
          0
        );


      document.getElementById(
        "cartTotal"
      ).textContent =
        formatarPreco(total);

    }


    /* =====================================
       ABRIR CARRINHO
    ===================================== */

    function abrirCarrinho() {

      document
        .getElementById("cart")
        .classList.add("open");


      document
        .getElementById("cartOverlay")
        .classList.add("active");

    }


    /* =====================================
       FECHAR CARRINHO
    ===================================== */

    function fecharCarrinho() {

      document
        .getElementById("cart")
        .classList.remove("open");


      document
        .getElementById("cartOverlay")
        .classList.remove("active");

    }


    /* =====================================
       CHECKOUT WHATSAPP
    ===================================== */

    function finalizarCompra() {

      if (!carrinho.length) {

        alert(
          "Seu carrinho está vazio."
        );

        return;

      }


      let mensagem =
        "Olá! Estou interessado nestes produtos:%0A%0A";


      let total = 0;


      carrinho.forEach(item => {

        const subtotal =
          item.preco * item.quantidade;


        total += subtotal;


        mensagem +=
          "• " +
          item.nome +
          " — " +
          item.quantidade +
          "x — " +
          formatarPreco(subtotal) +
          "%0A";

      });


      mensagem +=
        "%0A" +
        "Total: " +
        formatarPreco(total) +
        "%0A%0A" +
        "Gostaria de finalizar a compra.";


      const url =
        WHATSAPP_BASE +
        "&text=" +
        mensagem;


      window.open(
        url,
        "_blank"
      );

    }


    /* =====================================
       BUSCA
    ===================================== */

    document
      .getElementById("search")
      .addEventListener(
        "input",
        function () {

          const termo =
            this.value
              .trim()
              .toLowerCase();


          if (!termo) {

            renderizarProdutos(
              produtos
            );

            return;

          }


          const filtrados =
            produtos.filter(
              produto =>
                produto.nome
                  .toLowerCase()
                  .includes(termo)
            );


          renderizarProdutos(
            filtrados
          );

        }
      );


    /* =====================================
       INICIAR
    ===================================== */

    carregarProdutos();

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TUDOCRIA</title>

<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
font-family: Arial, Helvetica, sans-serif;
background: #f5f0df;
color: #111;
}

button,
input {
font: inherit;
}

button {
cursor: pointer;
}

/* =========================
HEADER
\========================= */

header {
background: #0d5c3a;
color: white;
height: 72px;
display: flex;
align-items: center;
justify-content: space-between;
padding: 0 22px;
position: sticky;
top: 0;
z-index: 1000;
box-shadow: 0 2px 12px rgba(0,0,0,.12);
}

.logo {
font-size: 25px;
font-weight: 900;
letter-spacing: -1px;
}

.cart-button {
background: white;
color: #0d5c3a;
border: none;
border-radius: 999px;
padding: 10px 15px;
font-weight: 800;
display: flex;
align-items: center;
gap: 7px;
}

.cart-count {
background: #0d5c3a;
color: white;
min-width: 22px;
height: 22px;
border-radius: 50%;
display: inline-flex;
align-items: center;
justify-content: center;
font-size: 12px;
}

/* =========================
HERO
\========================= */

.hero {
background: #0d5c3a;
color: white;
padding: 55px 20px 65px;
text-align: center;
}

.hero h1 {
font-size: clamp(35px, 8vw, 72px);
line-height: .95;
font-weight: 900;
letter-spacing: -3px;
margin-bottom: 16px;
}

.hero p {
font-size: 16px;
opacity: .9;
}

/* =========================
CONTAINER
\========================= */

.container {
width: min(1200px, calc(100% - 30px));
margin: 0 auto;
}

/* =========================
BUSCA
\========================= */

.search-area {
padding: 25px 0 10px;
}

.search-box {
width: 100%;
background: white;
border: 2px solid #ddd7c6;
border-radius: 14px;
padding: 15px 17px;
outline: none;
font-size: 16px;
}

.search-box\:focus {
border-color: #0d5c3a;
}

/* =========================
CATEGORIAS
\========================= */

.categories {
display: flex;
gap: 8px;
overflow-x: auto;
padding: 12px 0 20px;
scrollbar-width: none;
}

.categories::-webkit-scrollbar {
display: none;
}

.category-button {
flex-shrink: 0;
border: 1px solid #cfc8b7;
background: transparent;
border-radius: 999px;
padding: 9px 15px;
font-weight: 700;
color: #222;
}

.category-button.active {
background: #0d5c3a;
border-color: #0d5c3a;
color: white;
}

/* =========================
PRODUTOS
\========================= */

.products-header {
display: flex;
justify-content: space-between;
align-items: center;
margin: 10px 0 18px;
}

.products-header h2 {
font-size: 25px;
font-weight: 900;
}

.product-count {
font-size: 13px;
opacity: .65;
}

.products-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 18px;
padding-bottom: 60px;
}

.product-card {
background: white;
border-radius: 18px;
overflow: hidden;
box-shadow: 0 4px 18px rgba(0,0,0,.07);
transition: transform .2s ease, box-shadow .2s ease;
}

.product-card\:hover {
transform: translateY(-3px);
box-shadow: 0 8px 25px rgba(0,0,0,.11);
}

.product-image {
width: 100%;
aspect-ratio: 1 / 1;
background: #eee;
overflow: hidden;
position: relative;
}

.product-image img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}

.no-image {
width: 100%;
height: 100%;
display: flex;
align-items: center;
justify-content: center;
color: #888;
font-size: 13px;
}

.featured-badge {
position: absolute;
top: 10px;
left: 10px;
background: #0d5c3a;
color: white;
padding: 6px 9px;
border-radius: 8px;
font-size: 11px;
font-weight: 800;
text-transform: uppercase;
}

.product-info {
padding: 15px;
}

.product-category {
font-size: 11px;
text-transform: uppercase;
letter-spacing: .7px;
color: #777;
margin-bottom: 6px;
font-weight: 700;
}

.product-name {
font-size: 17px;
font-weight: 800;
line-height: 1.15;
margin-bottom: 10px;
}

.product-price {
font-size: 20px;
font-weight: 900;
margin-bottom: 13px;
}

.add-button {
width: 100%;
border: none;
background: #0d5c3a;
color: white;
padding: 12px;
border-radius: 10px;
font-weight: 800;
}

.add-button\:active {
transform: scale(.98);
}

/* =========================
LOADING / ERRO
\========================= */

.loading,
.empty,
.error {
grid-column: 1 / -1;
text-align: center;
padding: 50px 20px;
}

.error {
color: #a00000;
}

/* =========================
CARRINHO
\========================= */

.cart-overlay {
position: fixed;
inset: 0;
background: rgba(0,0,0,.45);
z-index: 2000;
opacity: 0;
visibility: hidden;
transition: .2s ease;
}

.cart-overlay.open {
opacity: 1;
visibility: visible;
}

.cart-drawer {
position: absolute;
right: 0;
top: 0;
height: 100%;
width: min(430px, 100%);
background: #f5f0df;
transform: translateX(100%);
transition: .25s ease;
display: flex;
flex-direction: column;
}

.cart-overlay.open .cart-drawer {
transform: translateX(0);
}

.cart-header {
background: #0d5c3a;
color: white;
padding: 20px;
display: flex;
align-items: center;
justify-content: space-between;
}

.cart-header h2 {
font-size: 22px;
}

.close-cart {
border: none;
background: transparent;
color: white;
font-size: 28px;
line-height: 1;
}

.cart-items {
flex: 1;
overflow-y: auto;
padding: 15px;
}

.cart-item {
background: white;
border-radius: 13px;
padding: 12px;
display: flex;
gap: 12px;
margin-bottom: 10px;
}

.cart-item-image {
width: 75px;
height: 75px;
flex-shrink: 0;
border-radius: 9px;
overflow: hidden;
background: #eee;
}

.cart-item-image img {
width: 100%;
height: 100%;
object-fit: cover;
}

.cart-item-info {
flex: 1;
min-width: 0;
}

.cart-item-name {
font-weight: 800;
font-size: 14px;
margin-bottom: 6px;
}

.cart-item-price {
font-weight: 800;
font-size: 14px;
}

.quantity-controls {
display: flex;
align-items: center;
gap: 8px;
margin-top: 8px;
}

.quantity-controls button {
border: none;
background: #0d5c3a;
color: white;
width: 25px;
height: 25px;
border-radius: 6px;
font-weight: 900;
}

.remove-item {
margin-left: auto;
background: transparent !important;
color: #999 !important;
width: auto !important;
height: auto !important;
}

.cart-footer {
background: white;
padding: 18px;
border-top: 1px solid #ddd;
}

.cart-total {
display: flex;
justify-content: space-between;
align-items: center;
font-size: 20px;
font-weight: 900;
margin-bottom: 15px;
}

.checkout-button {
width: 100%;
background: #0d5c3a;
color: white;
border: none;
border-radius: 12px;
padding: 15px;
font-weight: 900;
font-size: 16px;
}

.clear-cart {
width: 100%;
margin-top: 8px;
background: transparent;
border: none;
padding: 8px;
color: #777;
font-size: 13px;
}

/* =========================
FOOTER
\========================= */

footer {
background: #0d5c3a;
color: white;
text-align: center;
padding: 30px 20px;
}

footer strong {
font-size: 20px;
}

footer p {
margin-top: 7px;
font-size: 13px;
opacity: .75;
}

/* =========================
RESPONSIVO
\========================= */

@media (max-width: 950px) {
.products-grid {
grid-template-columns: repeat(3, 1fr);
}
}

@media (max-width: 700px) {
header {
height: 65px;
padding: 0 15px;
}

.logo {
font-size: 22px;
}

.hero {
padding: 45px 18px 50px;
}

.hero h1 {
letter-spacing: -2px;
}

.products-grid {
grid-template-columns: repeat(2, 1fr);
gap: 12px;
}

.product-info {
padding: 12px;
}

.product-name {
font-size: 15px;
}

.product-price {
font-size: 18px;
}

.add-button {
padding: 10px;
font-size: 13px;
}
}

@media (max-width: 400px) {
.products-grid {
gap: 9px;
}

.container {
width: min(100% - 20px, 1200px);
}
}
</style>
</head>

<body>

<!-- =========================
HEADER
\========================= -->

<header>
<div class="logo">TUDOCRIA</div>

<button class="cart-button" onclick="abrirCarrinho()">
🛒 Carrinho
<span class="cart-count" id="cartCount">0</span>
</button>
</header>


<!-- =========================
HERO
\========================= -->

<section class="hero">
<h1>Escolha o seu próximo par.</h1>
<p>Streetwear, atitude e estilo em um só lugar.</p>
</section>


<!-- =========================
CONTEÚDO
\========================= -->

<main class="container">

<div class="search-area">
<input
type="search"
id="searchInput"
class="search-box"
placeholder="Buscar produto..."
autocomplete="off"
>
</div>

<div class="categories" id="categories"></div>

<div class="products-header">
<h2>Produtos</h2>
<span class="product-count" id="productCount"></span>
</div>

<div class="products-grid" id="productsGrid">
<div class="loading">
Carregando produtos...
</div>
</div>

</main>


<!-- =========================
CARRINHO
\========================= -->

<div class="cart-overlay" id="cartOverlay">

<div class="cart-drawer">

<div class="cart-header">
<h2>Seu carrinho</h2>

<button
class="close-cart"
onclick="fecharCarrinho()"
aria-label="Fechar carrinho"
>
×
</button>
</div>

<div class="cart-items" id="cartItems"></div>

<div class="cart-footer">

<div class="cart-total">
<span>Total</span>
<span id="cartTotal">R$ 0,00</span>
</div>

<button
class="checkout-button"
onclick="finalizarWhatsApp()"
>
Finalizar pelo WhatsApp
</button>

<button
class="clear-cart"
onclick="limparCarrinho()"
>
Limpar carrinho
</button>

</div>

</div>

</div>


<!-- =========================
FOOTER
\========================= -->

<footer>
<strong>TUDOCRIA</strong>
<p>Seu estilo. Sua atitude.</p>
</footer>


<script>

/* =====================================================
CONFIGURAÇÕES
\===================================================== */

const WORKER_URL =
"https://tudocria.ricardorodrigues0671.workers.dev";

const PRODUCT_ENDPOINT =
WORKER_URL + "/produtos";

const WHATSAPP_BASE =
"https://wa.me/5543984458252";


/* =====================================================
ESTADO
\===================================================== */

let produtos = [];

let produtosFiltrados = [];

let carrinho = [];

let categoriaAtual = "Todos";


/* =====================================================
ELEMENTOS
\===================================================== */

const productsGrid =
document.getElementById("productsGrid");

const productCount =
document.getElementById("productCount");

const searchInput =
document.getElementById("searchInput");

const categoriesContainer =
document.getElementById("categories");

const cartCount =
document.getElementById("cartCount");

const cartItems =
document.getElementById("cartItems");

const cartTotal =
document.getElementById("cartTotal");

const cartOverlay =
document.getElementById("cartOverlay");


/* =====================================================
FORMATAÇÃO DE PREÇO
\===================================================== */

function formatarPreco(valor) {

const numero = Number(valor);

if (!Number.isFinite(numero)) {
return "R$ 0,00";
}

return numero.toLocaleString("pt-BR", {
style: "currency",
currency: "BRL"
});
}


/* =====================================================
NORMALIZAÇÃO

O NOVO WORKER JÁ ENVIA:

_preco
_imagem

Então não precisamos mais interpretar
"preço venda" ou "imagens" aqui.
\===================================================== */

function normalizarProduto(p) {

return {

id: p.ID ?? p.Id ?? p.id ?? null,

nome: p.Nome ?? p.nome ?? "Produto",

sku: p.SKU ?? p.Sku ?? p.sku ?? "",

descricao: p.Descrição ?? p.descrição ?? "",

categoria: p.Categoria ?? p.categoria ?? "",

preco: Number(p._preco) || 0,

imagem: p._imagem || "",

ativo: p.Ativo !== false && p.ativo !== false,

destaque: p.Destaque === true || p.destaque === true

};

}


/* =====================================================
CARREGAR PRODUTOS
\===================================================== */

async function carregarProdutos() {

productsGrid.innerHTML = \`
<div class="loading">
Carregando produtos...
</div>
\`;

try {

const resposta =
await fetch(PRODUCT_ENDPOINT, {
method: "GET",
cache: "no-store"
});

if (!resposta.ok) {
throw new Error(
"Erro HTTP " + resposta.status
);
}

const dados =
await resposta.json();

console.log(
"TUDOCRIA - resposta do Worker:",
dados
);

const lista =
Array.isArray(dados)
? dados
: Array.isArray(dados.results)
? dados.results
: [];

produtos =
lista
.map(normalizarProduto)
.filter(produto => produto.ativo);

console.log(
"TUDOCRIA - produtos normalizados:",
produtos
);

produtosFiltrados = [...produtos];

criarCategorias();

renderizarProdutos();

atualizarCarrinho();

} catch (erro) {

console.error(
"TUDOCRIA - erro:",
erro
);

productsGrid.innerHTML = \`
<div class="error">
<strong>Não foi possível carregar os produtos.</strong>
<br><br>
Verifique se o Worker está publicado corretamente.
</div>
\`;

}

}


/* =====================================================
CATEGORIAS
\===================================================== */

function criarCategorias() {

const categorias = [
"Todos",
...new Set(
produtos
.map(p => p.categoria)
.filter(Boolean)
)
];

categoriesContainer.innerHTML = "";

categorias.forEach(categoria => {

const button =
document.createElement("button");

button.className =
"category-button" +
(categoria === categoriaAtual
? " active"
: "");

button.textContent = categoria;

button.onclick = () => {

categoriaAtual = categoria;

document
.querySelectorAll(".category-button")
.forEach(btn => {
btn.classList.remove("active");
});

button.classList.add("active");

aplicarFiltros();

};

categoriesContainer.appendChild(button);

});

}


/* =====================================================
BUSCA
\===================================================== */

searchInput.addEventListener(
"input",
aplicarFiltros
);


function aplicarFiltros() {

const busca =
searchInput.value
.trim()
.toLowerCase();

produtosFiltrados =
produtos.filter(produto => {

const correspondeCategoria =
categoriaAtual === "Todos" ||
produto.categoria === categoriaAtual;

const textoBusca = [
produto.nome,
produto.sku,
produto.categoria
]
.join(" ")
.toLowerCase();

const correspondeBusca =
!busca ||
textoBusca.includes(busca);

return (
correspondeCategoria &&
correspondeBusca
);

});

renderizarProdutos();

}


/* =====================================================
RENDERIZAR PRODUTOS
\===================================================== */

function renderizarProdutos() {

productCount.textContent =
produtosFiltrados.length +
(
produtosFiltrados.length === 1
? " produto"
: " produtos"
);

if (produtosFiltrados.length === 0) {

productsGrid.innerHTML = \`
<div class="empty">
Nenhum produto encontrado.
</div>
\`;

return;
}

productsGrid.innerHTML = "";

produtosFiltrados.forEach(produto => {

const card =
document.createElement("article");

card.className =
"product-card";

const imagemHTML =
produto.imagem
? \`
<img
src="${escaparHTML(produto.imagem)}"
alt="${escaparHTML(produto.nome)}"
loading="lazy"
onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
>

<div
class="no-image"
style="display\:none"
>
Imagem indisponível
</div>
\`
: \`
<div class="no-image">
Imagem indisponível
</div>
\`;

card.innerHTML = \`

<div class="product-image">

${imagemHTML}

${
produto.destaque
? \`
<span class="featured-badge">
Destaque
</span>
\`
: ""
}

</div>

<div class="product-info">

${
produto.categoria
? \`
<div class="product-category">
${escaparHTML(produto.categoria)}
</div>
\`
: ""
}

<div class="product-name">
${escaparHTML(produto.nome)}
</div>

<div class="product-price">
${formatarPreco(produto.preco)}
</div>

<button
class="add-button"
onclick="adicionarAoCarrinho(${JSON.stringify(produto.id)})"
>
Adicionar ao carrinho
</button>

</div>

\`;

productsGrid.appendChild(card);

});

}


/* =====================================================
ESCAPAR HTML
\===================================================== */

function escaparHTML(valor) {

return String(valor ?? "")
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");

}


/* =====================================================
CARRINHO
\===================================================== */

function adicionarAoCarrinho(id) {

const produto =
produtos.find(
p => String(p.id) === String(id)
);

if (!produto) {
return;
}

const existente =
carrinho.find(
item =>
String(item.produto.id) ===
String(produto.id)
);

if (existente) {

existente.quantidade++;

} else {

carrinho.push({
produto: produto,
quantidade: 1
});

}

atualizarCarrinho();

abrirCarrinho();

}


function alterarQuantidade(id, quantidade) {

const item =
carrinho.find(
item =>
String(item.produto.id) ===
String(id)
);

if (!item) {
return;
}

item.quantidade += quantidade;

if (item.quantidade <= 0) {

carrinho =
carrinho.filter(
item =>
String(item.produto.id) !==
String(id)
);

}

atualizarCarrinho();

}


function removerDoCarrinho(id) {

carrinho =
carrinho.filter(
item =>
String(item.produto.id) !==
String(id)
);

atualizarCarrinho();

}


function limparCarrinho() {

carrinho = [];

atualizarCarrinho();

}


/* =====================================================
ATUALIZAR CARRINHO
\===================================================== */

function atualizarCarrinho() {

const quantidadeTotal =
carrinho.reduce(
(total, item) =>
total + item.quantidade,
0
);

cartCount.textContent =
quantidadeTotal;

if (carrinho.length === 0) {

cartItems.innerHTML = \`
<div class="empty">
Seu carrinho está vazio.
</div>
\`;

cartTotal.textContent =
"R$ 0,00";

return;
}

cartItems.innerHTML = "";

let total = 0;

carrinho.forEach(item => {

const produto =
item.produto;

const subtotal =
produto.preco *
item.quantidade;

total += subtotal;

const elemento =
document.createElement("div");

elemento.className =
"cart-item";

elemento.innerHTML = \`

<div class="cart-item-image">

${
produto.imagem
? \`
<img
src="${escaparHTML(produto.imagem)}"
alt="${escaparHTML(produto.nome)}"
>
\`
: ""
}

</div>

<div class="cart-item-info">

<div class="cart-item-name">
${escaparHTML(produto.nome)}
</div>

<div class="cart-item-price">
${formatarPreco(subtotal)}
</div>

<div class="quantity-controls">

<button
onclick="alterarQuantidade(${JSON.stringify(produto.id)}, -1)"
>
−
</button>

<span>
${item.quantidade}
</span>

<button
onclick="alterarQuantidade(${JSON.stringify(produto.id)}, 1)"
>
\+
</button>

<button
class="remove-item"
onclick="removerDoCarrinho(${JSON.stringify(produto.id)})"
>
🗑
</button>

</div>

</div>

\`;

cartItems.appendChild(elemento);

});

cartTotal.textContent =
formatarPreco(total);

}


/* =====================================================
ABRIR / FECHAR CARRINHO
\===================================================== */

function abrirCarrinho() {

cartOverlay.classList.add("open");

document.body.style.overflow =
"hidden";

}


function fecharCarrinho() {

cartOverlay.classList.remove("open");

document.body.style.overflow =
"";

}


cartOverlay.addEventListener(
"click",
function(event) {

if (
event.target === cartOverlay
) {
fecharCarrinho();
}

}
);


/* =====================================================
WHATSAPP
\===================================================== */

function finalizarWhatsApp() {

if (carrinho.length === 0) {

alert(
"Adicione pelo menos um produto ao carrinho."
);

return;
}

let mensagem =
"Olá! Estou interessado nestes produtos:%0A%0A";

let total = 0;

carrinho.forEach(item => {

const subtotal =
item.produto.preco *
item.quantidade;

total += subtotal;

mensagem +=
"• " +
item.produto.nome +
" — " +
item.quantidade +
"x — " +
formatarPreco(item.produto.preco) +
"%0A";

});

mensagem +=
"%0ATotal: " +
formatarPreco(total) +
"%0A%0A";

mensagem +=
"Gostaria de finalizar a compra.";

const url =
WHATSAPP_BASE +
"&text=" +
encodeURIComponent(
decodeURIComponent(mensagem)
);

window.open(
url,
"_blank"
);

}


/* =====================================================
INICIAR
\===================================================== */

carregarProdutos();

</script>

</body>
</html>
